    body {
      font-family: 'Malgun Gothic', sans-serif;
      padding: 10px;
      background-color: #e9ecef;
      margin: 0;
      color: #333;
    }

    .card {
      background: white;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0 15px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
    }

    .btn-small {
      width: auto;
      padding: 6px 12px;
      font-size: 13px;
      margin: 0;
    }

    .cal-wrapper {
      overflow-x: auto;
      padding-bottom: 10px;
    }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      min-width: 950px;
      border-top: 2px solid #555;
      border-left: 1px solid #ccc;
      background: #fff;
    }

    .cal-header-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      min-width: 950px;
      text-align: center;
      font-weight: bold;
      background: #f8f9fa;
      border-left: 1px solid #ccc;
    }

    .cal-header-cell {
      padding: 8px 0;
      border-right: 1px solid #ccc;
      border-bottom: 1px solid #ccc;
      font-size: 14px;
    }

    .day-cell {
      border-right: 1px solid #ccc;
      border-bottom: 1px solid #ccc;
      display: flex;
      flex-direction: column;
    }

    .day-header-bar {
      display: grid;
      grid-template-columns: calc(50% + 22.5px) calc(50% - 22.5px);
      background: #f1f3f5;
      border-bottom: 1px solid #ddd;
      font-size: 12px;
      font-weight: bold;
      text-align: center;
    }

    /*
     * 아래 실제 행 구조는
     * [조/근무 45px] + [휴무 입력] + [대근 입력]
     * 이므로 헤더도 동일한 열 비율을 사용합니다.
     */
    .day-date-part {
      width: 100%;
      padding: 4px;
      border-right: 1px solid #ddd;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
    }

    .day-sub-title {
      width: 100%;
      padding: 4px;
      color: #0056b3;
      background: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
    }

    .holiday-name {
      font-size: 11px;
      font-weight: normal;
      margin-left: 3px;
      letter-spacing: -0.5px;
    }

    .team-row {
      display: flex;
      min-height: 35px;
      border-bottom: 1px solid #eee;
      font-size: 12px;
    }

    .memo-row {
      border-top: 1px solid #ccc;
      background-color: #fff9c4;
      border-bottom: none;
    }

    .my-team-row {
      background-color: #e6f2ff;
    }

    .cell-shift {
      width: 45px;
      flex-shrink: 0;
      box-sizing: border-box;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      border-right: 1px solid #eee;
    }

    .cell-name {
      flex: 1 1 0;
      min-width: 0;
      box-sizing: border-box;
      display: flex;
      justify-content: center;
      align-items: center;
      border-right: 1px solid #eee;
      color: #495057;
      position: relative;
    }

    .cell-name:last-child {
      border-right: none;
    }

    .off-request-cell {
      background-color: #ffffff !important;
    }

    .clickable {
      cursor: pointer;
    }

    .clickable:hover {
      background-color: #f1f3f5;
    }

    .has-data {
      font-weight: bold;
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1.2;
    }

    .req-data {
      color: #1e8449;
    }

    .sub-data {
      color: #495057;
      background-color: transparent;
      width: 100%;
      height: 100%;
      justify-content: center;
      display: flex;
      align-items: center;
    }

    .reason-text {
      font-size: 10px;
      color: #888;
      font-weight: normal;
    }

    .suggest-guide {
      color: inherit;
      font-weight: bold;
      font-size: 12px;
    }

    /* 대근칸 바탕은 신청 조, 이름 색은 대근자의 소속 조를 따릅니다. */
    .cell-name.sub-cell-A { background-color: #ffd29a; color: #663300; }
    .cell-name.sub-cell-B { background-color: #dff2df; color: #14532d; }
    .cell-name.sub-cell-C { background-color: #deecff; color: #123e73; }
    .cell-name.sub-cell-D { background-color: #fff2b8; color: #594400; }
    .cell-name.sub-cell-A .suggest-guide { color: #663300; }
    .cell-name.sub-cell-B .suggest-guide { color: #14532d; }
    .cell-name.sub-cell-C .suggest-guide { color: #123e73; }
    .cell-name.sub-cell-D .suggest-guide { color: #594400; }

    .cell-name.req-cell-B:not(.off-request-cell) { background-color: #dcf5ed; }

    /* 소속 조 색상은 휴무와 대근에 동일하게 적용합니다. */
    .has-data.person-team-A { color: #07559b; }
    .has-data.person-team-B { color: #17713b; }
    .has-data.person-team-C { color: #96520a; }
    .has-data.person-team-D { color: #7139a6; }

    .s-day {
      color: #1e8449;
      font-weight: bold;
    }

    .s-night {
      color: #2980b9;
      font-weight: bold;
    }

    .s-off {
      color: #7f8c8d;
    }

    #mainScreen {
      display: none;
    }

function memoSlotsForWeek(date,data){
  const start=weekStart(date),end=new Date(start);end.setDate(end.getDate()+7);

  // 슈퍼관리자

  function plusDays(dateStr, days) {

    const date = new Date(`${dateStr}T00:00:00Z`);

    date.setUTCDate(
      date.getUTCDate() + days
    );

    return date
      .toISOString()
      .slice(0, 10);

  }


  function getUtcDay(dateStr) {

    return new Date(
      `${dateStr}T00:00:00Z`
    ).getUTCDay();

  }


  function addPlannedHolidays(year) {

    const holidays = [];

    const addHoliday = (date, name, canSubstitute) => {

      holidays.push({
        date,
        name,
        canSubstitute
      });

    };


    [
      ['01-01', '신정', false],
      ['03-01', '3·1절', true],
      ['05-05', '어린이날', true],
      ['06-06', '현충일', false],
      ['08-15', '광복절', true],
      ['10-03', '개천절', true],
      ['10-09', '한글날', true],
      ['12-25', '성탄절', true]
    ].forEach(([monthDay, name, canSubstitute]) => {

      addHoliday(
        `${year}-${monthDay}`,
        name,
        canSubstitute
      );

    });


    const lunar =
      PLANNED_LUNAR_DATES[year];


    if (lunar) {

      [-1, 0, 1].forEach(offset => {

        const date = plusDays(
          lunar.newYear,
          offset
        );

        addHoliday(
          date,
          offset === 0 ? '설날' : '설연휴',
          true
        );

      });


      addHoliday(
        lunar.buddha,
        '부처님오신날',
        true
      );


      [-1, 0, 1].forEach(offset => {

        const date = plusDays(
          lunar.chuseok,
          offset
        );

        addHoliday(
          date,
          offset === 0 ? '추석' : '추석연휴',
          true
        );

      });

    }


    const dates = new Set(
      holidays.map(holiday => holiday.date)
    );

    const duplicateDates =
      holidays.reduce((counts, holiday) => {

        counts[holiday.date] =
          (counts[holiday.date] || 0) + 1;

        return counts;

      }, {});


    holidays.forEach(holiday => {

      HOLIDAYS[holiday.date] =
        HOLIDAYS[holiday.date] ||
        holiday.name;

    });


    holidays
      .filter(holiday => holiday.canSubstitute)
      .forEach(holiday => {

        if (
          getUtcDay(holiday.date) !== 0 &&
          duplicateDates[holiday.date] < 2
        ) {

          return;

        }


        let substituteDate =
          plusDays(holiday.date, 1);


        while (
          dates.has(substituteDate) ||
          getUtcDay(substituteDate) === 0
        ) {

          substituteDate = plusDays(
            substituteDate,
            1
          );

        }


        dates.add(substituteDate);

        HOLIDAYS[substituteDate] =
          '대체공휴일';

      });

  }


  function getShiftInfo(
    team,
    dateObj
  ) {

    const targetDate =
      new Date(
        dateObj.getFullYear(),
        dateObj.getMonth(),
        dateObj.getDate()
      );

    const baseDate =
      new Date(
        BASE_DATE.getFullYear(),
        BASE_DATE.getMonth(),
        BASE_DATE.getDate()
      );

    const diffTime =
      targetDate - baseDate;

    const diffDays =
      Math.floor(
        diffTime /
        (1000 * 60 * 60 * 24)
      );

    let index =
      (
        diffDays +
        TEAM_OFFSET[team]
      ) % 8;

    if (index < 0) {
      index += 8;
    }

    return PATTERN[index];

  }

  function getSuggestedHelperTeam(
    targetTeam,
    shiftType,
    dateObj
  ) {

    const prevDate =
      new Date(dateObj);

    prevDate.setDate(
      dateObj.getDate() - 1
    );


    const nextDate =
      new Date(dateObj);

    nextDate.setDate(
      dateObj.getDate() + 1
    );


    let helperTeam = '';


    TEAMS.forEach(t => {

      if (t === targetTeam) {
        return;
      }


      const pShift =
        getShiftInfo(
          t,
          prevDate
        );


      const nShift =
        getShiftInfo(
          t,
          nextDate
        );


      if (
        shiftType === '주간'
      ) {

        if (
          pShift === '주간' ||
          nShift === '주간'
        ) {

          helperTeam =
            t + '조';

        }

      } else if (
        shiftType === '야간'
      ) {

        if (
          pShift === '야간' ||
          nShift === '야간'
        ) {

          helperTeam =
            t + '조';

        }

      }

    });


    return helperTeam;

  }


  function getShortShift(shift) {

function localDateKey(date) {
  return [date.getFullYear(), String(date.getMonth()+1).padStart(2,'0'), String(date.getDate()).padStart(2,'0')].join('-');
}
function weekStart(date) {
  const start = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  start.setDate(start.getDate() - start.getDay());
  return start;
}
function visibleTeamRowIndexes(weekDate, team, data, today, compact = true) {
  const start = weekStart(weekDate);
  const end = new Date(start); end.setDate(end.getDate()+7);
  const daily = Array.from({length:7}, (_,day) => {
    const date = new Date(start); date.setDate(date.getDate()+day);
    return data.filter(request => request.team === team && request.shift_date === localDateKey(date));
  });
  const count = Math.max(1, ...daily.map(rows => rows.length+1));
  const midnight = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  const indexes = Array.from({length:count}, (_,index)=>index);
  if (!compact || end > midnight) return indexes;
  // Only stored request/support/helper data count; automatic guide labels never enter this calculation.
  const filled = indexes.filter(index => daily.some(rows => {
    const request = rows[index];
    return request && (String(request.requested_by ?? '').trim() ||
      String(request.filled_by ?? '').trim() || request.request_kind === 'support' ||
      String(request.reason ?? '').trim() || request.requested_by_id != null);
  }));
  return filled.length ? filled : [0];
}

     *
     * 핵심:
     * A조에서 휴무 신청이 1건 발생하면

     *
     * 따라서 조의 행이 다른 조를 밀어내지 않고,
     * A → B → C → D 순서가 모든 날짜에서 유지됩니다.

    const weekTeamRows = {};

      let checkDay = 1;
      checkDay <= lastDate;
      checkDay++
    ) {

      const checkDate =
        new Date(
          currentYear,
          currentMonth,
          checkDay
        );

        `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(checkDay).padStart(2, '0')}`;


      const weekStartDay =
        checkDay -
        checkDate.getDay() +
        1;


      const weekKey =
        `${currentYear}-${currentMonth}-${weekStartDay}`;

      TEAMS.forEach(team => {

        const requestCount =
          requestsData.filter(
            r =>

              r.team === team

        /*
         * 기본 조 행은 항상 1개 유지하고,
         * 휴무 신청자 수만큼 그 바로 아래에 추가 행을 만듭니다.
         *
         * 예:
         * 신청 0명 → 기본 1행
         * 신청 1명 → 기본 1행 + 추가 1행 = 2행

        /*

        weekTeamRows[weekKey][team] =

      const date = new Date(currentYear, currentMonth, day);
      const key = `${currentYear}-${currentMonth}-${day-date.getDay()+1}`;
      if (Array.isArray(weekTeamRows[key][TEAMS[0]])) continue;
      const nextSunday = weekStart(date);
      nextSunday.setDate(nextSunday.getDate()+7);
      const todayStart = new Date(calendarToday.getFullYear(), calendarToday.getMonth(), calendarToday.getDate());
      for (const team of TEAMS) {
        weekTeamRows[key][team] = nextSunday <= todayStart
          ? visibleTeamRowIndexes(date, team, requestsData, calendarToday)
          : Array.from({length:weekTeamRows[key][team]}, (_,index)=>index);
      }
    }

    for (
      let i = 0;
      i < firstDay;
      i++
    ) {

      grid.innerHTML +=
        `<div></div>`;

    }


    for (
      let d = 1;
      d <= lastDate;
      d++
    ) {

      const dateObj =
        new Date(
          currentYear,
          currentMonth,
          d
        );


      const yyyy =
        currentYear;


      const mm =
        String(
          currentMonth + 1
        ).padStart(
          2,
          '0'
        );


      const dd =
        String(d).padStart(
          2,
          '0'
        );


      const dateStr =
        `${yyyy}-${mm}-${dd}`;


      const dayOfWeek =
        dateObj.getDay();


      const holidayName =
        HOLIDAYS[dateStr];


      let dateColorStyle = '';


      if (
        dayOfWeek === 0 ||
        holidayName
      ) {

        dateColorStyle =
          'color: #e74c3c;';

      } else if (
        dayOfWeek === 6
      ) {

        dateColorStyle =
          'color: #007bff;';

      }


      let holidayHtml =
        holidayName
          ? `<span class="holiday-name">(${holidayName})</span>`
          : '';


      let dayHtml = `
        <div class="day-cell${dateStr===calendarTodayKey()?' is-today':''}" id="calendar-day-${dateStr}" ${dateStr===calendarTodayKey()?'aria-current="date"':''}>

          <div class="day-header-bar">

            <div
              class="day-date-part"
              style="${dateColorStyle}"
            >
              ${mm}/${dd} ${holidayHtml}
            </div>

            <div class="day-sub-title">
              대근
            </div>

          </div>
      `;


      const weekStartDay =
        d -
        dateObj.getDay() +
        1;


      const weekKey =
        `${currentYear}-${currentMonth}-${weekStartDay}`;


      /*
       * ======================================
       * A / B / C / D 조
       * ======================================
       *
       * 조별로 먼저 '필요한 행 수'를 확보합니다.
       * 그래서 B조 신청자가 2명이어도
       * C조가 B조의 두 번째 행 위치로 밀려나지 않습니다.
       */

      TEAMS.forEach(team => {

        const shift =
          getShiftInfo(
            team,
            dateObj
          );


        const isMyTeam =
          (
            currentUser &&
            team === currentUser.team
          )
            ? 'my-team-row'
            : '';


        const offRequestClass =
          (
            shift === '휴무'
          )
            ? 'off-request-cell'
            : '';


        const reqsForTeam =
          requestsData.filter(
            r =>
              r.shift_date === dateStr &&
              r.team === team
          );


        let suggestedTeam = '';


        if (
          shift !== '휴무'
        ) {

          suggestedTeam =
            getSuggestedHelperTeam(
              team,
              shift,
              dateObj
            );

        }


        const rowsForThisTeam =
          (
            weekTeamRows[weekKey] &&
            weekTeamRows[weekKey][team]
          ) || [0];


        /*
         * 이 주의 이 조에서 필요한 만큼만 행을 만듭니다.
         * 실제 신청자가 있는 날짜에는 신청자를 순서대로 넣고,
         * 나머지 날짜에는 빈 행을 유지합니다.
         */

        for (const rowIndex of rowsForThisTeam) {

          /*
           * 기존 조 행 자체가 첫 번째 휴무 신청 행입니다.
           * 따라서 신청자가 있으면 rowIndex 0부터 순서대로 표시하고,
           * 마지막 1행은 다음 신청을 위한 빈 행으로 남깁니다.
           */
          const req =
            reqsForTeam[rowIndex] ||
            null;


          let reqName = '';
          let reqClick = '';
          let reqClass =
            `cell-name req-cell-${team} ${offRequestClass}`;


          let subName = '';
          let subClick = '';
          let subCellClass =
            `cell-name sub-cell-${team}`;


          /*
           * 실제 휴무 신청이 있는 행
           */
          if (req) {

            const reasonHtml =
              !isSupportRequest(req) && req.reason
                ? `<span class="reason-text">(${escapeRequestText(req.reason)})</span>`
                : '';


            reqName = `
              <div class="has-data req-data person-team-${team}">
                <span>${escapeRequestText(requestDisplayName(req))}</span>
                ${reasonHtml}
              </div>
            `;


            if (
              currentUser &&
              (
                isOwnRequest(req) ||
                isSuperAdmin()
              )
            ) {

              reqClick =
                `onclick="deleteRequest('${req.id}', '${isSupportRequest(req) ? '추가 지원' : '휴무 신청'}')"`;

              reqClass +=
                ' clickable';

            }


            if (req.filled_by) {

              subName = `
                <div class="has-data sub-data ${TEAMS.includes(req.helper_team) ? `person-team-${req.helper_team}` : ''}">
                  <span>${escapeRequestText(req.filled_by)}</span>
                </div>
              `;


              if (
                currentUser &&
                (
                  req.filled_by === currentUser.name ||
                  isSuperAdmin() ||
                  (
                    isTeamAdmin() &&
                    canRegisterSubstitution(req.team)
                  )
                )
              ) {

                subClick =
                  `onclick="cancelSub('${req.id}')"`;

                subCellClass +=
                  ' clickable';

              }

            } else {

              if (suggestedTeam) {

                subName =
                  `<span class="suggest-guide">${suggestedTeam}</span>`;

                subCellClass +=
                  ' suggest-box';

              }


              if (
                canRegisterSubstitution(team)
              ) {

                subClick =
                  `onclick="acceptRequest('${req.id}', '${team}', '${dateStr}', '${shift}')"`;

                subCellClass +=
                  ' clickable';

              }

            }

          }


          /*
           * 실제 신청이 없는 빈 행
           */
          else {

            /*
             * 아직 내 신청이 없다면
             * 이 빈 행에서 휴무 신청을 추가할 수 있습니다.
             */
            if (
              canRequestOff() &&
              shift !== '휴무' &&
              (
                isSuperAdmin() ||
                team === currentUser.team
              )
            ) {

              reqClick =
                `onclick="requestOff('${dateStr}', '${shift}', '${team}')"`;

              reqClass +=
                ' clickable';

            }


            let suggestGuideHtml = '';


            if (
              shift !== '휴무' &&
              suggestedTeam
            ) {

              suggestGuideHtml =
                `<span class="suggest-guide">${suggestedTeam}</span>`;

              subCellClass +=
                ' suggest-box';

            }


            /*
             * 빈 행의 대근 칸:
             * 해당 날짜/조에 실제 휴무 신청이 없으므로
             * 대근 등록은 불가합니다.
             */
            subClick =
              `onclick="alert('🚫 이 대근 칸에는 등록 가능한 휴무 신청이 없습니다. 먼저 해당 조의 휴무 신청을 등록해 주세요.');"`;

            subName =
              suggestGuideHtml;

          }


          dayHtml += `

            <div class="team-row shift-card-row shift-card-${team} ${rowIndex === rowsForThisTeam[0] ? 'shift-card-first' : ''} ${rowIndex === rowsForThisTeam[rowsForThisTeam.length - 1] ? 'shift-card-last' : ''} ${isMyTeam}">

              <div class="cell-shift ${getShiftClass(shift)}">
                ${team}${getShortShift(shift)}
              </div>

              <div
                class="${reqClass}"
                ${reqClick}
                title="${reqClick ? '클릭 시 휴무·추가 지원 신청/삭제' : ''}"
              >
                ${reqName}
              </div>

              <div
                class="${subCellClass}"
                ${subClick}
                title="클릭 시 대근 등록/취소"
              >
                ${subName}
              </div>

            </div>

          `;

        }

      });


      /*
       * ==================================
       * 메모
       * ==================================
       */

      const memoSlots=memoSlotsForWeek(dateObj,memosData);
      for(const slot of memoSlots){
        const entry=memosData.find(m=>m.date===dateStr && memoSlotKey(m)===slot.key);
        const label=slot.team?slot.team+'조 메모':slot.key==='empty'?'메모':'기존 메모';
        const entryId=entry?String(entry.id):'';
        dayHtml+=`<div class="team-row memo-row" data-memo-week="${localDateKey(weekStart(dateObj))}" data-memo-slot="${escapeRequestText(slot.key)}"><div class="cell-shift" style="color:#795548;font-size:10px">${escapeRequestText(label)}</div><div class="cell-name clickable" style="justify-content:center;text-align:center;padding:0 4px;font-size:11px;font-weight:bold;color:#333" onclick="editMemo('${dateStr}','${entryId}','${slot.team||''}')" title="같은 조만 수정·삭제할 수 있습니다. 다른 조는 메모를 추가할 수 있습니다.">${escapeRequestText(entry?.memo||'')}</div></div>`;
      }
      dayHtml+='</div>';

      grid.innerHTML +=
        dayHtml;

    }
    if(typeof requestAnimationFrame==='function')requestAnimationFrame(()=>synchronizeMemoRowHeights(grid));

  }

  /*
   * ==========================================
   * 휴무 신청
   * ==========================================
   */


  function escapeRequestText(value) {
    return String(value ?? '').replace(/[&<>"']/g, character => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[character]));
  }

  function isSupportReason(reason) {
    return /정수|지원/.test(String(reason ?? ''));
  }

  function isSupportRequest(request) {
    return request.request_kind === 'support' || isSupportReason(request.reason);
  }

  function requestDisplayName(request) {
    const reason = String(request.reason ?? '');
    if (reason.includes('정수')) return '정수 지원';
    if (reason.includes('지원')) return '지원';
    return request.request_kind === 'support'
      ? reason.trim() || '지원'
      : request.requested_by;
  }



// Keep multi-line memo heights aligned across the whole week, including after resize.
function synchronizeMemoRowHeights(grid){
 if(!grid?.querySelectorAll)return;
 const rows=[...grid.querySelectorAll('[data-memo-week][data-memo-slot]')],heights=new Map();
 rows.forEach(row=>row.style.minHeight='');
 rows.forEach(row=>{const key=row.dataset.memoWeek+':'+row.dataset.memoSlot;heights.set(key,Math.max(heights.get(key)||35,Math.ceil(row.getBoundingClientRect().height)));});
 rows.forEach(row=>{row.style.minHeight=heights.get(row.dataset.memoWeek+':'+row.dataset.memoSlot)+'px';});
}
if(typeof window!=='undefined')window.addEventListener('resize',()=>{if(typeof requestAnimationFrame==='function')requestAnimationFrame(()=>synchronizeMemoRowHeights(document.getElementById('calendarGrid')));});


let currentUser={id:29,name:'체험 사용자',team:'B',role:'user',is_active:true};
let currentSessionToken='demo-only',calendarReadOnlyDuringLoad=false;
let nowKey=calendarTodayKey(),currentYear=+nowKey.slice(0,4),currentMonth=+nowKey.slice(5,7)-1;
let requestsData=[],memosData=[],sequence=100;
function isTeamAdmin(){return currentUser.role==='team_admin'}
function isSuperAdmin(){return currentUser.role==='admin'}
function canRequestOff(){return !isTeamAdmin()}
function canRegisterSubstitution(team){return team!==currentUser.team}
function isOwnRequest(r){return r.requested_by_id===currentUser.id}
function loadData(){renderCalendar();updateStickyCalendarOffset()}
function changeMonth(n){currentMonth+=n;const d=new Date(currentYear,currentMonth,1);currentYear=d.getFullYear();currentMonth=d.getMonth();loadData()}
function goToMonth(){document.getElementById('monthJumpValue').value=currentYear+'-'+String(currentMonth+1).padStart(2,'0');document.getElementById('monthJumpDialog').showModal()}
function applyMonthJump(){let v=document.getElementById('monthJumpValue').value;if(!v)return;[currentYear,currentMonth]=v.split('-').map(Number);currentMonth--;document.getElementById('monthJumpDialog').close();loadData()}
function closeAppMenu(){document.getElementById('appMenuPanel').hidden=true;document.getElementById('appMenuToggle').setAttribute('aria-expanded','false')}
function toggleAppMenu(){let p=document.getElementById('appMenuPanel');p.hidden=!p.hidden;document.getElementById('appMenuToggle').setAttribute('aria-expanded',String(!p.hidden))}
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.app-actions'))closeAppMenu()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAppMenu()});
function synchronizeCalendarWeekdays(){document.getElementById('calendarWeekdayViewport').scrollLeft=document.querySelector('.cal-wrapper').scrollLeft}
function updateStickyCalendarOffset(){document.documentElement.style.setProperty('--shift-topbar-height',Math.ceil(document.getElementById('shiftAppTopbar').getBoundingClientRect().height)+'px');synchronizeCalendarWeekdays()}
function goToToday(){currentYear=+nowKey.slice(0,4);currentMonth=+nowKey.slice(5,7)-1;loadData();requestAnimationFrame(()=>{const e=document.getElementById('calendar-day-'+nowKey);const w=document.querySelector('.cal-wrapper');w.scrollLeft=e.offsetLeft-w.offsetLeft-8;const top=e.getBoundingClientRect().top+scrollY-document.getElementById('shiftAppTopbar').offsetHeight-document.getElementById('calendarWeekdaySticky').offsetHeight-20;window.scrollTo(0,Math.max(0,top))})}
function toast(s){document.getElementById('testStatus').textContent=s}
function askReason(team,date){return new Promise(resolve=>{const d=document.getElementById('reasonDialog'),input=document.getElementById('reasonInput');input.value='';document.getElementById('reasonContext').textContent=team+'조 · '+date;d.returnValue='';d.addEventListener('close',()=>resolve(d.returnValue==='save'?input.value.trim():null),{once:true});d.showModal()})}
async function callSessionRegistration(b){
 if(b.action==='request_create'){
 requestsData.push({id:'demo-'+(++sequence),requested_by:currentUser.name,requested_by_id:currentUser.id,request_kind:isSupportReason(b.reason)?'support':'off',team:b.team,shift_date:b.date,reason:b.reason,status:'OPEN'});
 document.getElementById('savedReason').textContent=b.reason?JSON.stringify(b.reason):'빈 문자열 (이름 자동 입력 없음)';
 toast('테스트 휴무가 등록됐습니다. 실제 서버에는 저장하지 않았습니다.');return {success:true};
 }
 if(b.action==='memo_write'){
 let m=memosData.find(m=>String(m.id)===String(b.memo_id));
 if(!b.memo){memosData=memosData.filter(x=>x!==m)}
 else if(m){m.memo=b.memo;m.revision++}
 else{memosData.push({id:String(++sequence),date:b.date,owner_team:currentUser.team,memo:b.memo,revision:1})}
 toast('테스트 메모를 반영했습니다.');return {success:true};
 }
 return {success:false,message:'체험 범위를 벗어난 기능입니다.'};
}
async function deleteRequest(id){if(!confirm('이 테스트 휴무를 삭제하시겠습니까?'))return;requestsData=requestsData.filter(r=>r.id!==id);loadData();toast('테스트 휴무를 삭제했습니다.')}
async function acceptRequest(id){const r=requestsData.find(r=>r.id===id);if(!r||!canRegisterSubstitution(r.team))return;if(!confirm('체험 사용자로 테스트 대근을 등록하시겠습니까?'))return;r.filled_by=currentUser.name;r.helper_team='B';r.status='FILLED';loadData();toast('테스트 대근을 등록했습니다. 실제 자격·중복 검증은 운영 서버 기준입니다.')}
async function cancelSub(id){if(!confirm('테스트 대근을 취소하시겠습니까?'))return;const r=requestsData.find(r=>r.id===id);r.filled_by=null;r.status='OPEN';loadData()}
function resetDemo(){
 requestsData=[];memosData=[];
 const end=new Date(currentYear,currentMonth+1,0).getDate();
 for(let day=1;day<=end;day++){
  let date=new Date(currentYear,currentMonth,day),key=localDateKey(date);
  if(day%5===2){let team=TEAMS.find(t=>t!=='B'&&getShiftInfo(t,date)!=='휴무');requestsData.push({id:'demo-'+(++sequence),requested_by:'샘플 직원',requested_by_id:900+day,request_kind:'off',team,shift_date:key,reason:day%2?'연차':'',status:'OPEN'})}
  if(day===+nowKey.slice(-2)||day===8)memosData.push({id:String(++sequence),date:key,owner_team:day===8?'C':'B',memo:day===8?'설비 점검\n작업 전 인수인계 확인':'인수인계 사항 확인\n보호구 착용',revision:1});
 }
 loadData();toast('샘플 데이터를 초기화했습니다.');
}
function testReason(){let day=1;while(getShiftInfo('B',new Date(currentYear,currentMonth,day))==='휴무')day++;requestOff(localDateKey(new Date(currentYear,currentMonth,day)),getShiftInfo('B',new Date(currentYear,currentMonth,day)),'B')}
  async function requestOff(
    date,
    shift,
    targetTeam
  ) {

    if (!currentUser) {

      alert(
        "로그인 후 이용해 주세요."
      );

      return;

    }


    /*
     * 조 관리자는 휴무 등록 불가
     */

    if (
      isTeamAdmin()
    ) {

      alert(
        "🚫 조 관리자 계정으로는 휴무 신청을 할 수 없습니다."
      );

      return;

    }


    /*
     * 슈퍼관리자:
     * 클릭한 조
     *
     * 일반 사용자:
     * 본인 조
     */

    const requestTeam =
      isSuperAdmin()
        ? targetTeam
        : currentUser.team;


    const reason = await askReason(requestTeam, date);
    if (reason === null) return;

    const requestKind = isSupportReason(reason) ? 'support' : 'off';
    if (requestKind === 'off' && requestsData.some(request =>
      request.shift_date === date && request.team === requestTeam &&
      !isSupportRequest(request) && isOwnRequest(request)
    )) {
      alert('이 날짜에 이미 본인의 휴무 신청이 있습니다. 추가 지원은 별도로 등록할 수 있습니다.');
      return;
    }

    const result = await callSessionRegistration({
      action: 'request_create', team: requestTeam, date, reason
    });
    if (result.sessionExpired) return;
    if (!result.success) {
      alert('❌ 신청 저장 실패: ' + result.message);
    } else {
      loadData();
    }

  }



  let memoSaving=false;
  async function editMemo(date,memoId='',slotTeam=''){
    if(!currentUser||!currentSessionToken)return;
    if(calendarReadOnlyDuringLoad){alert('통신 상태를 확인하고 일정을 다시 불러온 뒤 입력해 주세요.');return;}
    if(memoSaving)return;
    const token=currentSessionToken,team=currentUser.team;
    if(!['A','B','C','D'].includes(team)){alert('작성 조를 확인할 수 없습니다.');return;}
    const clicked=memosData.find(m=>String(m.id)===String(memoId)&&m.date===date);
    const own=memosData.find(m=>m.date===date&&m.owner_team===team);
    let target=clicked?.owner_team===team?clicked:own;
    if((clicked&&clicked.owner_team!==team)||(!target&&((slotTeam&&slotTeam!==team)||memosData.some(m=>m.date===date&&m.owner_team!==team)))){
      if(!confirm('메모를 추가하시겠습니까?'))return;
    }
    const value=prompt('['+date+'] '+team+'조 메모를 입력하세요.\n같은 조 인원만 수정·삭제할 수 있습니다.\n내용을 모두 지우고 확인하면 이 메모만 삭제됩니다.',target?.memo||'');
    if(value===null)return;
    if(Array.from(value).length>500){alert('메모는 500자 이내로 입력해 주세요.');return;}
    if(!target&&!value.trim())return;
    if(token!==currentSessionToken)return;
    memoSaving=true;
    try{
      const result=await callSessionRegistration({action:'memo_write',entry_mode:'team',date,memo:value.trim()?value:'',memo_id:target?String(target.id):null,revision:target?.revision??null});
      if(result.sessionExpired||token!==currentSessionToken)return;
      if(!result.success){alert('메모 저장 실패: '+result.message);}
      await loadData();
    }finally{memoSaving=false;}
  }


document.querySelector('.cal-wrapper').addEventListener('scroll',synchronizeCalendarWeekdays,{passive:true});
new ResizeObserver(updateStickyCalendarOffset).observe(document.getElementById('shiftAppTopbar'));
document.getElementById('designSwitch').addEventListener('change',e=>{document.getElementById('polish').disabled=e.target.value==='original'});
resetDemo();
