</div><p id="shareUpdated" style="font-size:12px;color:#64748b"></p><p style="font-size:12px;color:#64748b">공유 링크를 가진 사람은 이 화면을 볼 수 있습니다. 링크를 다른 사람에게 전달하지 마세요. 아이폰은 Safari → 공유 → 홈 화면에 추가로 설치할 수 있습니다.</p><dialog id="monthJumpDialog"><form onsubmit="event.preventDefault();applyMonthJump()"><h3>이동할 년월</h3><input id="monthJumpValue" type="month" min="2000-01" max="2099-12" required><button type="button" onclick="document.getElementById('monthJumpDialog').close()">취소</button><button type="submit">이동</button></form></dialog><script>  let HOLIDAYS = {

    "2027-02-09": "대체휴무",

    "2027-03-01": "3·1절",
    "2027-05-05": "어린이날",
    "2027-05-13": "부처님오신날",
    "2027-06-06": "현충일",

    "2027-08-15": "광복절",

    "2027-09-14": "추석연휴",
    "2027-09-15": "추석",
    "2027-09-16": "추석연휴",

    "2027-10-03": "개천절",

  };


  /*
   * 공공데이터포털에 아직 공식 일정이 없는 먼 미래 연도용 예비 음력 날짜입니다.
   * 공식 API 자료가 있으면 그 자료를 먼저 사용합니다.
   */
  const PATTERN = [
    '주간',
    '주간',
    '휴무',
    '휴무',
    '야간',
    '야간',
    '휴무',
    '휴무'
  ];


  const TEAM_OFFSET = {

    'A': 0,
    'C': 2,
    'D': 4,
    'B': 6

  };


  const BASE_DATE =
    new Date('2026-09-30T00:00:00');


  const TEAMS = [
    'A',
    'B',
    'C',
    'D'
  ];


  /*
   * ==========================================
   * 권한 함수
   * ==========================================
   */

  // 슈퍼관리자
  function isSuperAdmin() {

    return (
      currentUser &&
      currentUser.role === 'admin'
    );

  }


  // 조 관리자
  function isTeamAdmin() {

    return (
      currentUser &&
      currentUser.role === 'team_admin'
    );

  }


  // 관리자 여부
  function isManager() {

    return (
      isSuperAdmin() ||
      isTeamAdmin()
    );

  }


  /*
   * 휴무 등록 가능 여부
   *
   * user     : 가능
   * team_admin: 불가
   * admin    : 가능
   */

  function canRequestOff() {

    return (
      currentUser &&
      currentUser.is_active &&
      (
        currentUser.role === 'user' ||
        currentUser.role === 'admin'
      )
    );

  }


  /*
   * 대근 기능 사용 가능 여부
   */

  function canDoSubstitution() {

    return (
      currentUser &&
      currentUser.is_active &&
      (
        currentUser.role === 'user' ||
        currentUser.role === 'team_admin' ||
        currentUser.role === 'admin'
      )
    );

  }


  /*
   * 대근 등록 권한을 달력 표시와 실제 처리에서 함께 사용합니다.
   * 일반 사용자: 다른 조 휴무에 등록
   * 조 관리자: 담당하는 다른 조 휴무에 자기 조 직원을 지정
   * 슈퍼관리자: 모든 조 휴무에 등록
   */
  function canRegisterSubstitution(targetTeam) {
    if (!currentUser || !currentUser.is_active) return false;
    if (currentUser.role === 'admin') return true;
    if (currentUser.role === 'team_admin') {
      return (currentUser.team === 'A' || currentUser.team === 'D')
        ? ['B', 'C'].includes(targetTeam)
        : (currentUser.team === 'B' || currentUser.team === 'C') && ['A', 'D'].includes(targetTeam);
    }
    if (currentUser.role === 'user') {
      return targetTeam !== currentUser.team;
    }
    return false;
  }

  /*
   * ==========================================
   * 근무 계산
   * ==========================================
   */

  function getShiftInfo(
    team,
    dateObj
  ) {

    const targetDate =
      new Date(
        dateObj.getFullYear(),
        dateObj.getMonth(),
        dateObj.getDate()
      );

    const baseDate =
      new Date(
        BASE_DATE.getFullYear(),
        BASE_DATE.getMonth(),
        BASE_DATE.getDate()
      );

    const diffTime =
      targetDate - baseDate;

    const diffDays =
      Math.floor(
        diffTime /
        (1000 * 60 * 60 * 24)
      );

    let index =
      (
        diffDays +
        TEAM_OFFSET[team]
      ) % 8;

    if (index < 0) {
      index += 8;
    }

    return PATTERN[index];

  }


  /*
   * ==========================================
   * 추천 대근 조
   * ==========================================
   */

  function getSuggestedHelperTeam(
    targetTeam,
    shiftType,
    dateObj
  ) {

    const prevDate =
      new Date(dateObj);

    prevDate.setDate(
      dateObj.getDate() - 1
    );


    const nextDate =
      new Date(dateObj);

    nextDate.setDate(
      dateObj.getDate() + 1
    );


    let helperTeam = '';


    TEAMS.forEach(t => {

      if (t === targetTeam) {
        return;
      }


      const pShift =
        getShiftInfo(
          t,
          prevDate
        );


      const nShift =
        getShiftInfo(
          t,
          nextDate
        );


      if (
        shiftType === '주간'
      ) {

        if (
          pShift === '주간' ||
          nShift === '주간'
        ) {

          helperTeam =
            t + '조';

        }

      } else if (
        shiftType === '야간'
      ) {

        if (
          pShift === '야간' ||
          nShift === '야간'
        ) {

          helperTeam =
            t + '조';

        }

      }

    });


    return helperTeam;

  }


  function getShortShift(shift) {

    if (shift === '주간') {
      return '주';
    }

    if (shift === '야간') {
      return '야';
    }

    return '휴';

  }


  function getShiftClass(shift) {

    if (shift === '주간') {
      return 's-day';
    }

    if (shift === '야간') {
      return 's-night';
    }

    return 's-off';

  }


function localDateKey(date) {
  return [date.getFullYear(), String(date.getMonth()+1).padStart(2,'0'), String(date.getDate()).padStart(2,'0')].join('-');
}
function weekStart(date) {
  const start = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  start.setDate(start.getDate() - start.getDay());
  return start;
}
function visibleTeamRowIndexes(weekDate, team, data, today, compact = true) {
  const start = weekStart(weekDate);
  const end = new Date(start); end.setDate(end.getDate()+7);
  const daily = Array.from({length:7}, (_,day) => {
    const date = new Date(start); date.setDate(date.getDate()+day);
    return data.filter(request => request.team === team && request.shift_date === localDateKey(date));
  });
  const count = Math.max(1, ...daily.map(rows => rows.length+1));
  const midnight = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  const indexes = Array.from({length:count}, (_,index)=>index);
  if (!compact || end > midnight) return indexes;
  // Only stored request/support/helper data count; automatic guide labels never enter this calculation.
  const filled = indexes.filter(index => daily.some(rows => {
    const request = rows[index];
    return request && (String(request.requested_by ?? '').trim() ||
      String(request.filled_by ?? '').trim() || request.request_kind === 'support' ||
      String(request.reason ?? '').trim() || request.requested_by_id != null);
  }));
  return filled.length ? filled : [0];
}

  function renderCalendar() {

    document
      .getElementById('currentMonthStr')
      .innerText =
      `${currentYear}년 ${currentMonth + 1}월`;


    const grid =
      document.getElementById(
        'calendarGrid'
      );


    grid.innerHTML = '';


    const firstDay =
      new Date(
        currentYear,
        currentMonth,
        1
      ).getDay();


    const lastDate =
      new Date(
        currentYear,
        currentMonth + 1,
        0
      ).getDate();


    /*
     * ==========================================
     * 주별 / 조별 휴무 행 수 계산
     * ==========================================
     *
     * 핵심:
     * A조에서 휴무 신청이 1건 발생하면
     * 그 주의 모든 날짜에 A조 행을 1줄 확보합니다.
     *
     * B조에서 2건이면
     * 그 주의 모든 날짜에 B조 행을 2줄 확보합니다.
     *
     * 따라서 조의 행이 다른 조를 밀어내지 않고,
     * A → B → C → D 순서가 모든 날짜에서 유지됩니다.
     */

    const weekTeamRows = {};


    for (
      let checkDay = 1;
      checkDay <= lastDate;
      checkDay++
    ) {

      const checkDate =
        new Date(
          currentYear,
          currentMonth,
          checkDay
        );


      const checkDateStr =
        `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(checkDay).padStart(2, '0')}`;


      const weekStartDay =
        checkDay -
        checkDate.getDay() +
        1;


      const weekKey =
        `${currentYear}-${currentMonth}-${weekStartDay}`;


      if (!weekTeamRows[weekKey]) {
        weekTeamRows[weekKey] = {};
      }


      TEAMS.forEach(team => {

        const requestCount =
          requestsData.filter(
            r =>
              r.shift_date === checkDateStr &&
              r.team === team
          ).length;


        /*
         * 기본 조 행은 항상 1개 유지하고,
         * 휴무 신청자 수만큼 그 바로 아래에 추가 행을 만듭니다.
         *
         * 예:
         * 신청 0명 → 기본 1행
         * 신청 1명 → 기본 1행 + 추가 1행 = 2행
         * 신청 2명 → 기본 1행 + 추가 2행 = 3행
         */
        /*
         * 해당 주의 이 조는:
         * - 휴무 신청자 N명
         * - + 다음 신청을 위한 빈 행 1개
         *
         * 총 N + 1행을 확보합니다.
         *
         * 신청 0명 → 기본 1행
         * 신청 1명 → 신청자 1행 + 빈 행 1개 = 2행
         * 신청 2명 → 신청자 2행 + 빈 행 1개 = 3행
         */
        weekTeamRows[weekKey][team] =
          Math.max(
            weekTeamRows[weekKey][team] || 1,
            requestCount + 1
          );

      });

    }


    // 지난 주만 일요일~토요일 전체의 실제 입력을 검사합니다.
    // 이번 주와 미래 주는 기존 월내 최대 신청 수 + 빈 행을 유지합니다.
    const calendarToday = new Date();
    for (let day = 1; day <= lastDate; day++) {
      const date = new Date(currentYear, currentMonth, day);
      const key = `${currentYear}-${currentMonth}-${day-date.getDay()+1}`;
      if (Array.isArray(weekTeamRows[key][TEAMS[0]])) continue;
      const nextSunday = weekStart(date);
      nextSunday.setDate(nextSunday.getDate()+7);
      const todayStart = new Date(calendarToday.getFullYear(), calendarToday.getMonth(), calendarToday.getDate());
      for (const team of TEAMS) {
        weekTeamRows[key][team] = nextSunday <= todayStart
          ? visibleTeamRowIndexes(date, team, requestsData, calendarToday)
          : Array.from({length:weekTeamRows[key][team]}, (_,index)=>index);
      }
    }

    for (
      let i = 0;
      i < firstDay;
      i++
    ) {

      grid.innerHTML +=
        `<div></div>`;

    }


    for (
      let d = 1;
      d <= lastDate;
      d++
    ) {

      const dateObj =
        new Date(
          currentYear,
          currentMonth,
          d
        );


      const yyyy =
        currentYear;


      const mm =
        String(
          currentMonth + 1
        ).padStart(
          2,
          '0'
        );


      const dd =
        String(d).padStart(
          2,
          '0'
        );


      const dateStr =
        `${yyyy}-${mm}-${dd}`;


      const dayOfWeek =
        dateObj.getDay();


      const holidayName =
        HOLIDAYS[dateStr];


      let dateColorStyle = '';


      if (
        dayOfWeek === 0 ||
        holidayName
      ) {

        dateColorStyle =
          'color: #e74c3c;';

      } else if (
        dayOfWeek === 6
      ) {

        dateColorStyle =
          'color: #007bff;';

      }


      let holidayHtml =
        holidayName
          ? `<span class="holiday-name">(${holidayName})</span>`
          : '';


      let dayHtml = `
        <div class="day-cell" id="calendar-day-${dateStr}">

          <div class="day-header-bar">

            <div
              class="day-date-part"
              style="${dateColorStyle}"
            >
              ${mm}/${dd} ${holidayHtml}
            </div>

            <div class="day-sub-title">
              대근
            </div>

          </div>
      `;


      const weekStartDay =
        d -
        dateObj.getDay() +
        1;


      const weekKey =
        `${currentYear}-${currentMonth}-${weekStartDay}`;


      /*
       * ======================================
       * A / B / C / D 조
       * ======================================
       *
       * 조별로 먼저 '필요한 행 수'를 확보합니다.
       * 그래서 B조 신청자가 2명이어도
       * C조가 B조의 두 번째 행 위치로 밀려나지 않습니다.
       */

      TEAMS.forEach(team => {

          getShiftInfo(
            team,
            dateObj
          );


        const isMyTeam =
          (
            currentUser &&
            team === currentUser.team
          )
            ? 'my-team-row'
            : '';


        const offRequestClass =
          (
            shift === '휴무'
          )
            ? 'off-request-cell'
            : '';


        const reqsForTeam =
          requestsData.filter(
            r =>
              r.shift_date === dateStr &&
              r.team === team
          );


        let suggestedTeam = '';


        if (
          shift !== '휴무'
        ) {

          suggestedTeam =
            getSuggestedHelperTeam(
              team,
              shift,
              dateObj
            );

        }


        const rowsForThisTeam =
          (
            weekTeamRows[weekKey] &&
            weekTeamRows[weekKey][team]
          ) || [0];


        /*
         * 이 주의 이 조에서 필요한 만큼만 행을 만듭니다.
         * 실제 신청자가 있는 날짜에는 신청자를 순서대로 넣고,
         * 나머지 날짜에는 빈 행을 유지합니다.
         */

        for (const rowIndex of rowsForThisTeam) {

          /*
           * 기존 조 행 자체가 첫 번째 휴무 신청 행입니다.
           * 따라서 신청자가 있으면 rowIndex 0부터 순서대로 표시하고,
           * 마지막 1행은 다음 신청을 위한 빈 행으로 남깁니다.
           */
          const req =
            reqsForTeam[rowIndex] ||
            null;


          let reqName = '';
          let reqClick = '';
          let reqClass =
            `cell-name req-cell-${team} ${offRequestClass}`;


          let subName = '';
          let subClick = '';
          let subCellClass =
            `cell-name sub-cell-${team}`;


          /*
           * 실제 휴무 신청이 있는 행
           */
          if (req) {

            const reasonHtml =
              !isSupportRequest(req) && req.reason
                ? `<span class="reason-text">(${escapeRequestText(req.reason)})</span>`
                : '';


            reqName = `
              <div class="has-data req-data person-team-${team}">

            if (
              currentUser &&
              (
                isOwnRequest(req) ||

              )
            ) {

              reqClick =
                `onclick="deleteRequest('${req.id}', '${isSupportRequest(req) ? '추가 지원' : '휴무 신청'}')"`;

                ' clickable';

            if (req.filled_by) {

              if (

                  )

            } else {

            if (

              shift !== '휴무' &&
              (

                `onclick="requestOff('${dateStr}', '${shift}', '${team}')"`;

              reqClass +=
                ' clickable';

            }


            let suggestGuideHtml = '';


            if (
              shift !== '휴무' &&
              suggestedTeam
            ) {

              suggestGuideHtml =
                `<span class="suggest-guide">${suggestedTeam}</span>`;

              subCellClass +=
                ' suggest-box';

            }


            /*
             * 빈 행의 대근 칸:
             * 해당 날짜/조에 실제 휴무 신청이 없으므로
             * 대근 등록은 불가합니다.
             */
            subClick =
              `onclick="alert('🚫 이 대근 칸에는 등록 가능한 휴무 신청이 없습니다. 먼저 해당 조의 휴무 신청을 등록해 주세요.');"`;

            subName =
              suggestGuideHtml;

          }


          dayHtml += `

            <div class="team-row ${isMyTeam}">

              <div class="cell-shift ${getShiftClass(shift)}">
                ${team}${getShortShift(shift)}
              </div>

              <div
                class="${reqClass}"
                ${reqClick}
                title="${reqClick ? '클릭 시 휴무·추가 지원 신청/삭제' : ''}"
              >
                ${reqName}
              </div>

              <div
                class="${subCellClass}"
                ${subClick}
                title="클릭 시 대근 등록/취소"

                ${subName}
              </div>

            </div>

          `;

        }

      });


      /*
       * ==================================
       * 메모
       * ==================================
       */

      const memoObj =
        memosData.find(
          m =>
            m.date === dateStr
        );


      const memoText =
        memoObj

      dayHtml += `

      grid.innerHTML +=

  }

  /*
   * ==========================================
   * 휴무 신청
   * ==========================================
   */

  function escapeRequestText(value) {
    return String(value ?? '').replace(/[&<>"']/g, character => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[character]));
  }

  function isSupportReason(reason) {
    return /정수|지원/.test(String(reason ?? ''));
  }

  function isSupportRequest(request) {
    return request.request_kind === 'support' || isSupportReason(request.reason);
  }

  function requestDisplayName(request) {
    const reason = String(request.reason ?? '');
    if (reason.includes('정수')) return '정수 지원';
    if (reason.includes('지원')) return '지원';
    return request.request_kind === 'support'
      ? reason.trim() || '지원'
      : request.requested_by;
  }
