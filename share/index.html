<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#007bff"><title>교대근무 · 열람 전용</title><link rel="manifest" href="./manifest.json"><link rel="apple-touch-icon" href="/icons/shift-sun-moon-v2-180.png"><link rel="stylesheet" href="../assets/calendar.css?v=20261014.1"><style>#mainScreen{display:block}#calendarGrid .cell-name{cursor:default!important}#mainScreen .app-actions button{font-size:13px!important;width:auto!important;min-width:70px!important;padding:10px!important;line-height:1.4}#mainScreen .app-actions button::before{display:none!important}</style><link rel="icon" type="image/png" href="/icons/shift-sun-moon-v2-192.png">
</head><body><div id="mainScreen" style="display:block"><div class="card app-topbar"><div class="app-identity"><h2>교대근무 · 열람 전용</h2><small>근무·휴무·대근·메모 확인</small></div><div class="app-month"><button class="btn-small" onclick="changeMonth(-1)" aria-label="이전 달">◀</button><button id="currentMonthStr" onclick="goToMonth()">년월</button><button class="btn-small" onclick="changeMonth(1)" aria-label="다음 달">▶</button></div><div class="app-actions"><button class="btn-small" onclick="loadData()">새로고침</button><button id="shareInstall" hidden class="btn-small">홈 화면에 설치</button></div></div><div class="card"><p id="shareStatus" role="status">확인 중…</p><div id="shareConnect" hidden><p>설치한 앱에 공유 링크를 한 번 연결해 주세요.</p><form onsubmit="event.preventDefault();connectSharedLink()"><label for="shareLinkInput">전달받은 공유 링크</label><input id="shareLinkInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="공유 링크를 붙여넣어 주세요"><button type="submit">공유 링크 연결</button></form><small>연결 후 이 앱에서 계속 열람할 수 있습니다.</small></div><small>모든 조의 일정을 확인할 수 있습니다. 등록·수정·삭제는 불가능합니다.</small></div><div class="card app-calendar">

</div><p id="shareUpdated" style="font-size:12px;color:#64748b"></p><p style="font-size:12px;color:#64748b">공유 링크를 가진 사람은 이 화면을 볼 수 있습니다. 링크를 다른 사람에게 전달하지 마세요. 아이폰은 Safari → 공유 → 홈 화면에 추가로 설치할 수 있습니다.</p><dialog id="monthJumpDialog"><form onsubmit="event.preventDefault();applyMonthJump()"><h3>이동할 년월</h3><input id="monthJumpValue" type="month" min="2000-01" max="2099-12" required><button type="button" onclick="document.getElementById('monthJumpDialog').close()">취소</button><button type="submit">이동</button></form></dialog><script src="../assets/calendar.js?v=20261014.1"></script><script src="../assets/network.js?v=20261014.1"></script><script>  function isSuperAdmin() {

    return (
      currentUser &&
      currentUser.role === 'admin'
    );

  }


  // 조 관리자
  function isTeamAdmin() {

    return (
      currentUser &&
      currentUser.role === 'team_admin'
    );

  }


  // 관리자 여부
  function isManager() {

    return (
      isSuperAdmin() ||
      isTeamAdmin()
    );

  }


  /*
   * 휴무 등록 가능 여부
   *
   * user     : 가능
   * team_admin: 불가
   * admin    : 가능
   */

  function canRequestOff() {

    return (
      currentUser &&
      currentUser.is_active &&
      (
        currentUser.role === 'user' ||
        currentUser.role === 'admin'
      )
    );

  }


  /*
   * 대근 기능 사용 가능 여부
   */

  function canDoSubstitution() {

    return (
      currentUser &&
      currentUser.is_active &&
      (
        currentUser.role === 'user' ||
        currentUser.role === 'team_admin' ||
        currentUser.role === 'admin'
      )
    );

  }


  /*
   * 대근 등록 권한을 달력 표시와 실제 처리에서 함께 사용합니다.
   * 일반 사용자: 다른 조 휴무에 등록
   * 조 관리자: 담당하는 다른 조 휴무에 자기 조 직원을 지정
   * 슈퍼관리자: 모든 조 휴무에 등록
   */
  function canRegisterSubstitution(targetTeam) {
    if (!currentUser || !currentUser.is_active) return false;
    if (currentUser.role === 'admin') return true;
    if (currentUser.role === 'team_admin') {
      return (currentUser.team === 'A' || currentUser.team === 'D')
        ? ['B', 'C'].includes(targetTeam)
        : (currentUser.team === 'B' || currentUser.team === 'C') && ['A', 'D'].includes(targetTeam);
    }
    if (currentUser.role === 'user') {
      return targetTeam !== currentUser.team;
    }
    return false;
  }

  /*
   * ==========================================
   * 근무 계산
   * ==========================================
   */


function isSuperAdmin(){return false} function isTeamAdmin(){return false} function canRequestOff(){return false} function canRegisterSubstitution(){return false} function canDoSubstitution(){return false} function isOwnRequest(){return false}
let currentUser={role:"viewer",is_active:true};let currentYear=new Date().getFullYear(),currentMonth=new Date().getMonth(),requestsData=[],memosData=[];

const SHARE_API='https://lqqjyedfwlqinppcrvjf.supabase.co/functions/v1/app-schedule-share',SHARE_KEY='snnc-viewer-token-v1';
let shareToken='',readVersion=0,reading=false,installPrompt;
const field=id=>document.getElementById(id);
const parts=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit'}).format(new Date()).split('-');currentYear=Number(parts[0]);currentMonth=Number(parts[1])-1;
function shareTokenFrom(value){try{const v=value.trim();if(/^[0-9a-f]{64}$/.test(v))return v;const u=new URL(v);if(u.origin!==location.origin||!u.pathname.startsWith('/share/'))return '';const t=new URLSearchParams(u.hash.slice(1)).get('token')||'';return /^[0-9a-f]{64}$/.test(t)?t:'';}catch{return '';}}
function saveShareToken(token){shareToken=token;try{localStorage.setItem(SHARE_KEY,token);}catch{}history.replaceState(null,'',location.pathname+'#token='+token);}
try{const incoming=new URLSearchParams(location.hash.slice(1)).get('token')||'';shareToken=/^[0-9a-f]{64}$/.test(incoming)?incoming:localStorage.getItem(SHARE_KEY)||'';if(/^[0-9a-f]{64}$/.test(shareToken))saveShareToken(shareToken);}catch{shareToken=new URLSearchParams(location.hash.slice(1)).get('token')||'';}
async function connectSharedLink(){const t=shareTokenFrom(field('shareLinkInput').value);if(!t){field('shareStatus').textContent='전달받은 공유 링크 전체를 붙여넣어 주세요.';return;}saveShareToken(t);await loadData();}

const originalRender=renderCalendar;renderCalendar=function(){originalRender();field('calendarGrid').querySelectorAll('[onclick]').forEach(el=>el.removeAttribute('onclick'));field('calendarGrid').querySelectorAll('.clickable').forEach(el=>el.classList.remove('clickable'));};
async function loadData(){const version=++readVersion;reading=true;field('calendarGrid').innerHTML='';field('shareUpdated').textContent='';field('currentMonthStr').textContent=currentYear+'년 '+(currentMonth+1)+'월';field('shareStatus').textContent='최신 일정을 확인하고 있습니다…';field('shareConnect').hidden=/^[0-9a-f]{64}$/.test(shareToken);if(!/^[0-9a-f]{64}$/.test(shareToken)){field('shareStatus').textContent='이 기기에 공유 연결이 없습니다.';reading=false;return;}
try{addPlannedHolidays(currentYear);const response=await appFetch(SHARE_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'read_full',token:shareToken,month:currentYear+'-'+String(currentMonth+1).padStart(2,'0')}),cache:'no-store',signal:AbortSignal.timeout(15000)});const data=await response.json();if(version!==readVersion)return;if(!response.ok||!data.success)throw new Error(data.message||'연결을 확인하고 다시 시도해 주세요.');field('shareConnect').hidden=true;field('shareLinkInput').value='';requestsData=data.requests||[];memosData=data.memos||[];renderCalendar();field('shareStatus').textContent='';field('shareUpdated').textContent='마지막 확인: '+new Date().toLocaleString('ko-KR',{timeZone:'Asia/Seoul'});}catch(e){if(version===readVersion){field('shareConnect').hidden=false;field('shareStatus').textContent=e.message==='공유가 해제되었거나 유효하지 않은 링크입니다.'?e.message:'통신 오류로 일정을 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침해 주세요.';}}finally{if(version===readVersion)reading=false;}}
function changeMonth(n){const d=new Date(currentYear,currentMonth+n,1);currentYear=d.getFullYear();currentMonth=d.getMonth();loadData();}
function goToMonth(){field('monthJumpValue').value=currentYear+'-'+String(currentMonth+1).padStart(2,'0');field('monthJumpDialog').showModal();}
function applyMonthJump(){const v=field('monthJumpValue').value;if(!/^20\d{2}-(0[1-9]|1[0-2])$/.test(v))return;currentYear=Number(v.slice(0,4));currentMonth=Number(v.slice(5))-1;field('monthJumpDialog').close();loadData();}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;field('shareInstall').hidden=false;});field('shareInstall').onclick=async()=>{if(installPrompt){await installPrompt.prompt();installPrompt=null;field('shareInstall').hidden=true;}};
document.addEventListener('visibilitychange',()=>{if(document.hidden){++readVersion;field('calendarGrid').innerHTML='';}else loadData();});setInterval(()=>{if(!document.hidden&&!reading)loadData();},60000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{});loadData();
</script></body></html>
