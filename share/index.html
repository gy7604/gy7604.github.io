<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#183b56"><title>근무 확인</title><link rel="manifest" href="./manifest.json"><link rel="apple-touch-icon" href="../icons/icon-192.png"><style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#172b3a;font-family:system-ui,sans-serif}main{max-width:760px;margin:auto;padding:16px}header{position:sticky;top:0;background:#f1f5f9;padding:12px 0;z-index:1}h1{font-size:23px;margin:0 0 8px}.muted{color:#526879;font-size:13px;line-height:1.6}nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:16px 0}button{border:0;border-radius:10px;padding:12px;background:#183b56;color:#fff;font-size:15px}button:disabled{opacity:.5}.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.weekday{text-align:center;font-size:12px;padding:5px}.day{background:white;border-radius:9px;min-height:92px;padding:8px 5px;font-size:12px;overflow-wrap:anywhere;border:1px solid #e2e8f0}.date{font-weight:bold;margin-bottom:7px}.tag{display:block;border-radius:5px;padding:4px 2px;margin-top:3px;text-align:center}.주간{background:#dbeafe;color:#183f76}.야간{background:#ede9fe;color:#4a287e}.휴무{background:#e7edf1;color:#435260}.off{background:#ffe4e6;color:#9f1239}.sub{background:#fef3c7;color:#713f12}.today{outline:2px solid #007bff;outline-offset:-2px}#status{padding:10px 0}footer{margin-top:18px}.empty{min-height:0;background:transparent;border:0}@media(max-width:400px){main{padding:10px}.day{font-size:11px;padding:6px 3px}}[hidden]{display:none!important}
</style></head><body><main><header><h1 id="title">근무 확인</h1><div class="muted">열람 전용 · 근무, 휴무, 대근을 확인할 수 있습니다.</div><nav><button id="prev" aria-label="이전 달">◀</button><strong id="month"></strong><button id="next" aria-label="다음 달">▶</button></nav><button id="refresh">새로고침</button> <button id="install" hidden>홈 화면에 설치</button><p id="status" role="status">확인 중…</p></header><div id="calendar" class="grid"></div><footer class="muted">주간 07:00–19:00 · 야간 19:00–다음 날 07:00<br>일정을 변경할 수 없는 화면입니다. 공유 링크를 가진 사람은 이 일정을 볼 수 있으므로 다른 사람에게 전달하지 마세요.<p id="updated"></p><button id="forget">이 기기에서 공유 연결 해제</button><p id="guide">아이폰은 Safari의 공유 → 홈 화면에 추가로 설치할 수 있습니다. 카카오톡에서는 외부 브라우저로 열어 주세요.</p></footer></main><script>
const API='https://lqqjyedfwlqinppcrvjf.supabase.co/functions/v1/app-schedule-share';
const KEY='snnc-viewer-token-v1';let token='',version=0,busy=false,installPrompt;
const el=id=>document.getElementById(id);
const parts=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()).split('-');
const today=parts.join('-');let year=Number(parts[0]),month=Number(parts[1]);
try{const incoming=new URLSearchParams(location.hash.slice(1)).get('token');token=incoming||localStorage.getItem(KEY)||'';if(incoming&&/^[0-9a-f]{64}$/.test(incoming)){localStorage.setItem(KEY,incoming);history.replaceState(null,'',location.pathname);} }catch{token=new URLSearchParams(location.hash.slice(1)).get('token')||'';}
function shift(team,date){const offsets={A:0,C:2,D:4,B:6};if(!(team in offsets))return '확인 필요';const d=Math.round((Date.parse(date+'T00:00:00Z')-Date.parse('2026-09-30T00:00:00Z'))/86400000);return ['주간','주간','휴무','휴무','야간','야간','휴무','휴무'][((d+offsets[team])%8+8)%8];}
function render(data){const grid=el('calendar');grid.replaceChildren();['일','월','화','수','목','금','토'].forEach(t=>{const d=document.createElement('div');d.className='weekday';d.textContent=t;grid.append(d);});const start=new Date(Date.UTC(year,month-1,1)).getUTCDay(),days=new Date(Date.UTC(year,month,0)).getUTCDate();for(let i=0;i<start;i++){const d=document.createElement('div');d.className='day empty';grid.append(d);}for(let n=1;n<=days;n++){const date=year+'-'+String(month).padStart(2,'0')+'-'+String(n).padStart(2,'0'),rs=data.requests.filter(r=>r.date===date),base=shift(data.team,date),day=document.createElement('div');day.className='day'+(date===today?' today':'');const num=document.createElement('div');num.className='date';num.textContent=n;day.append(num);const tag=(text,cls)=>{const t=document.createElement('span');t.className='tag '+cls;t.textContent=text;day.append(t);};const off=rs.filter(r=>r.off),sub=rs.filter(r=>r.substitute);tag(off.some(r=>r.shift===base)?'휴무':base,off.some(r=>r.shift===base)?'휴무':base);off.forEach(r=>tag(r.shift+' 연차·휴무','off'));sub.forEach(r=>tag(r.shift+' 대근','sub'));grid.append(day);}}
async function load(){const v=++version;busy=true;el('calendar').replaceChildren();el('updated').textContent='';el('month').textContent=year+'년 '+month+'월';el('status').textContent='최신 일정을 확인하고 있습니다…';if(!/^[0-9a-f]{64}$/.test(token)){el('status').textContent='공유 링크로 먼저 접속해 주세요.';busy=false;return;}try{const res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'read',token,month:year+'-'+String(month).padStart(2,'0')}),cache:'no-store',signal:AbortSignal.timeout(15000)});const data=await res.json();if(v!==version)return;if(!res.ok||!data.success)throw new Error(data.message||'일정을 확인할 수 없습니다.');el('title').textContent=data.name+' · '+data.team+'조 근무';render(data);el('status').textContent='';el('updated').textContent='마지막 확인: '+new Date().toLocaleString('ko-KR',{timeZone:'Asia/Seoul'});}catch(e){if(v===version){el('title').textContent='근무 확인';el('status').textContent=e.message==='공유가 해제되었거나 유효하지 않은 링크입니다.'?e.message:'연결을 확인하고 새로고침해 주세요.';}}finally{if(v===version)busy=false;}}
function move(n){const d=new Date(Date.UTC(year,month-1+n,1));year=d.getUTCFullYear();month=d.getUTCMonth()+1;load();}
el('prev').onclick=()=>move(-1);el('next').onclick=()=>move(1);el('refresh').onclick=load;el('forget').onclick=()=>{if(!confirm('이 기기에서 공유 연결을 해제할까요?'))return;try{localStorage.removeItem(KEY);}catch{}token='';++version;el('title').textContent='근무 확인';load();};
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;el('install').hidden=false;});el('install').onclick=async()=>{if(installPrompt){await installPrompt.prompt();installPrompt=null;el('install').hidden=true;}};
document.addEventListener('visibilitychange',()=>{if(document.hidden){++version;el('calendar').replaceChildren();el('title').textContent='근무 확인';}else load();});setInterval(()=>{if(!document.hidden&&!busy)load();},60000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{});
load();
</script></body></html>
